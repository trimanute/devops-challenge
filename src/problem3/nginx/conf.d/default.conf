# Look up the "api" name again for each request (Docker's DNS is 127.0.0.11).
# Without this, nginx remembers the old IP, and after the api container restarts
# every request fails with 502 until nginx is reloaded.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    location /api/ {
        set $api http://api:3000;   # was 3001, but the API listens on 3000
        proxy_pass $api;

        proxy_set_header Host $host;
        proxy_connect_timeout 3s;   # fail fast, do not hang
        proxy_read_timeout 15s;
    }
}
