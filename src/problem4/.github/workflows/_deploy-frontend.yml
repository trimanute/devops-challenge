name: deploy-frontend

# Reusable: publish one built release to one environment, verify it, roll back on failure.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_SHA: ${{ inputs.sha }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40 character commit SHA" >&2; exit 1; }
          [[ "$ENVIRONMENT" =~ ^(staging|production)$ ]] || { echo "unknown environment" >&2; exit 1; }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read the currently deployed release
        id: previous
        run: |
          prev="$(aws ssm get-parameter --name "/web/$ENVIRONMENT/release-sha" \
            --query Parameter.Value --output text 2>/dev/null || true)"
          echo "sha=$prev" >> "$GITHUB_OUTPUT"
          echo "Currently deployed: ${prev:-none}"

      - name: Deploy to S3 and invalidate CloudFront
        run: frontend/deploy/s3-deploy.sh

      - name: Smoke test
        run: |
          for _ in $(seq 1 20); do
            body="$(curl -fsS --max-time 10 "$SITE_URL/version.json" || true)"
            if jq -e --arg sha "$RELEASE_SHA" '.sha == $sha' <<<"$body" >/dev/null 2>&1 \
              && curl -fsS --max-time 10 -o /dev/null "$SITE_URL/"; then
              echo "$SITE_URL is serving $RELEASE_SHA"
              exit 0
            fi
            sleep 6
          done
          echo "$SITE_URL is not serving $RELEASE_SHA (last response: $body)" >&2
          exit 1

      - name: Record release
        run: |
          aws ssm put-parameter --name "/web/$ENVIRONMENT/release-sha" \
            --type String --value "$RELEASE_SHA" --overwrite

      - name: Roll back to the previous release
        if: failure() && steps.previous.outputs.sha != '' && steps.previous.outputs.sha != inputs.sha
        env:
          RELEASE_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          echo "::warning::Deploy of ${{ inputs.sha }} failed, rolling back to $RELEASE_SHA"
          frontend/deploy/s3-deploy.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### frontend to $ENVIRONMENT"
            echo "- release: \`$RELEASE_SHA\`"
            echo "- previous: \`${{ steps.previous.outputs.sha }}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
