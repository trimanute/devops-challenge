name: deploy-backend

# Reusable: roll one published release out to one environment, verify it, roll back on failure.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Applies the environment's protection rules (reviewers, branch restriction) and its variables
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_SHA: ${{ inputs.sha }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_URL: ${{ vars.API_URL }}
    steps:
      # Inputs reach shell scripts only through env vars, and are validated first
      - name: Validate inputs
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40 character commit SHA" >&2; exit 1; }
          [[ "$ENVIRONMENT" =~ ^(staging|production)$ ]] || { echo "unknown environment" >&2; exit 1; }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The last release that passed its smoke test is recorded in Parameter Store
      - name: Read the currently deployed release
        id: previous
        run: |
          prev="$(aws ssm get-parameter --name "/api/$ENVIRONMENT/release-sha" \
            --query Parameter.Value --output text 2>/dev/null || true)"
          echo "sha=$prev" >> "$GITHUB_OUTPUT"
          echo "Currently deployed: ${prev:-none}"

      - name: Deploy (rolling, one instance at a time)
        run: backend/deploy/ssm-deploy.sh

      - name: Smoke test
        run: |
          for _ in $(seq 1 20); do
            body="$(curl -fsS --max-time 10 "$API_URL/healthz" || true)"
            if jq -e --arg sha "$RELEASE_SHA" '.version == $sha' <<<"$body" >/dev/null 2>&1; then
              echo "$API_URL is serving $RELEASE_SHA"
              exit 0
            fi
            sleep 6
          done
          echo "$API_URL is not serving $RELEASE_SHA (last response: $body)" >&2
          exit 1

      - name: Record release
        run: |
          aws ssm put-parameter --name "/api/$ENVIRONMENT/release-sha" \
            --type String --value "$RELEASE_SHA" --overwrite

      # Instances that failed their own health check already reverted themselves. This makes the
      # whole fleet converge on the last good release (for example after a failed smoke test).
      - name: Roll back to the previous release
        if: failure() && steps.previous.outputs.sha != '' && steps.previous.outputs.sha != inputs.sha
        env:
          RELEASE_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          echo "::warning::Deploy of ${{ inputs.sha }} failed, rolling back to $RELEASE_SHA"
          backend/deploy/ssm-deploy.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### backend to $ENVIRONMENT"
            echo "- release: \`$RELEASE_SHA\`"
            echo "- previous: \`${{ steps.previous.outputs.sha }}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
