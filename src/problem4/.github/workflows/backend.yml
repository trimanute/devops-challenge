name: backend

# Pull request: lint, test, audit and package (no AWS access).
# Push to main:  the same, then publish the artifact, deploy to staging, then production (approval).
# Manual run:    redeploy any previously published SHA to an environment (rollback).
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/_deploy-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/_deploy-backend.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA of a published release to deploy (rollback target)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

# PR runs are cancelled when a new commit arrives. Releases are never cancelled halfway
# and never run at the same time as another release.
concurrency:
  group: backend-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run lint --if-present
      - run: npm test
      # Fail on known high/critical vulnerabilities in what actually ships
      - run: npm audit --omit=dev --audit-level=high

      - name: Package release artifact
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-${{ github.sha }}
          path: backend/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC, no stored AWS keys
      contents: read
    env:
      RELEASE_SHA: ${{ github.sha }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-${{ github.sha }}
          path: dist

      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Releases are immutable: a re-run of the same commit never overwrites the stored artifact
      - name: Upload artifact to S3
        run: |
          key="api/$RELEASE_SHA.tar.gz"
          if aws s3api head-object --bucket "$ARTIFACT_BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "s3://$ARTIFACT_BUCKET/$key already exists, keeping it"
          else
            aws s3 cp "dist/$RELEASE_SHA.tar.gz" "s3://$ARTIFACT_BUCKET/$key" --only-show-errors
            aws s3 cp "dist/$RELEASE_SHA.tar.gz.sha256" "s3://$ARTIFACT_BUCKET/$key.sha256" --only-show-errors
          fi

  staging:
    needs: publish
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy-backend.yml
    with:
      environment: staging
      sha: ${{ github.sha }}

  # The "production" GitHub environment requires a reviewer, so this waits for approval
  production:
    needs: staging
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy-backend.yml
    with:
      environment: production
      sha: ${{ github.sha }}

  redeploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy-backend.yml
    with:
      environment: ${{ inputs.environment }}
      sha: ${{ inputs.sha }}
